[workspace]
# This is a separate Cargo project from the repo root (own Cargo.lock, own pinned
# nightly toolchain for rustc-dev/dylint) - it releases independently via its own
# release-plz pipeline. See crates/cargo-gears-core/build.rs's LINTS_PACKAGE_VERSION
# for how the CLI adopts a given cargo-gears-lints release.
allow_dirty = true

pr_labels = ["release-plz"]
changelog_update = true
git_release_enable = true
changelog_path = "CHANGELOG.md"

# No public Rust API surface - this crate is a cdylib-only dylint plugin loaded by
# the dylint driver, not consumed as a normal Rust library. cargo-semver-checks
# doesn't apply.
semver_check = false

# To prevent crates.io throttling
publish_timeout = "10m"

[changelog]
body = """

## [{{ version }}]\
    {%- if release_link -%}\
        ({{ release_link }})\
    {% endif %} \
    - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits
    | filter(attribute="merge_commit", value=false)
    | group_by(attribute="group")
%}
### {{ group | upper_first }}

    {% for commit in commits %}
        {%- if commit.scope -%}
            - *({{commit.scope}})* {% if commit.breaking %}[**breaking**] {% endif %}\
                {{ commit.message }}{{ self::username(commit=commit) }}\
                {%- if commit.links %} \
                    ({% for link in commit.links %}[{{link.text}}]({{link.href}}) {% endfor -%})\
                {% endif %}
        {% else -%}
            - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}{{ self::username(commit=commit) }}{{ self::pr(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor %}
{%- if remote.contributors %}
### Contributors
{% for contributor in remote.contributors %}
    * @{{ contributor.username }}
{%- endfor %}
{% endif -%}
{%- macro username(commit) -%}
    {% if commit.remote.username %} (by @{{ commit.remote.username }}){% endif -%}
{% endmacro -%}
{%- macro pr(commit) -%}
    {% if commit.remote.pr_number %} - #{{ commit.remote.pr_number }}{% endif -%}
{% endmacro -%}
"""
