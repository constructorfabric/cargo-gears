name: Dylint checks

on:
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'crates/cargo-gears-lints/*'
      - 'crates/cargo-gears-lints/**/*'
      - 'crates/cargo-gears/lints.tree'
      - 'tools/scripts/lints-tree.sh'

jobs:
  # release-plz only bumps cargo-gears for commits touching its packaged files, so
  # every lints change must also update crates/cargo-gears/lints.tree.
  lints-tree:
    name: Lints tree marker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tools/scripts/lints-tree.sh check

  test:
    name: Dylint libs checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/cargo-gears-lints
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2

      - run: rustup install
      - run: cargo fmt --check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-dylint,dylint-link
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --locked
